name: Release Mobile EAS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versao da release (ex: v1.2.0)"
        required: false
        type: string
      profile:
        description: Perfil EAS
        required: true
        default: production
        type: choice
        options:
          - preview
          - production
      platform:
        description: Plataforma de build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

env:
  NODE_VERSION: 20

jobs:
  release-mobile:
    runs-on: ubuntu-latest
    concurrency:
      group: release-mobile-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN nao configurado nos secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run lint
          npm test -- --runInBand

      - name: Resolve release parameters
        id: release_params
        env:
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          INPUT_PLATFORM: ${{ github.event.inputs.platform }}
          INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          SEMVER_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z-]+)?$'

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ${SEMVER_REGEX} ]]; then
              echo "Tag invalida: ${GITHUB_REF_NAME}. Use o formato vMAJOR.MINOR.PATCH (opcional sufixo)."
              exit 1
            fi

            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "platform=all" >> "$GITHUB_OUTPUT"
            echo "release_version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "profile=${INPUT_PROFILE}" >> "$GITHUB_OUTPUT"
            echo "platform=${INPUT_PLATFORM}" >> "$GITHUB_OUTPUT"

            if [ -n "${INPUT_RELEASE_VERSION}" ]; then
              if [[ ! "${INPUT_RELEASE_VERSION}" =~ ${SEMVER_REGEX} ]]; then
                echo "release_version invalida: ${INPUT_RELEASE_VERSION}. Use vMAJOR.MINOR.PATCH (opcional sufixo)."
                exit 1
              fi

              echo "release_version=${INPUT_RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
            else
              echo "release_version=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Release summary
        run: |
          echo "Release version: ${{ steps.release_params.outputs.release_version }}"
          echo "EAS profile: ${{ steps.release_params.outputs.profile }}"
          echo "Target platform: ${{ steps.release_params.outputs.platform }}"

      - name: Build Android with EAS
        if: ${{ steps.release_params.outputs.platform == 'all' || steps.release_params.outputs.platform == 'android' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --profile ${{ steps.release_params.outputs.profile }} \
            --platform android \
            --non-interactive

      - name: Build iOS with EAS
        if: ${{ steps.release_params.outputs.platform == 'all' || steps.release_params.outputs.platform == 'ios' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e

          OUTPUT_FILE="$(mktemp)"

          npx eas-cli build \
            --profile ${{ steps.release_params.outputs.profile }} \
            --platform ios \
            --non-interactive 2>&1 | tee "$OUTPUT_FILE"

          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi

          if [ "${{ steps.release_params.outputs.platform }}" = "all" ] && grep -qi "couldn't find any credentials suitable for internal distribution" "$OUTPUT_FILE"; then
            echo "iOS sem credenciais non-interactive para internal distribution. Android foi publicado e o job segue com sucesso."
            echo "Para habilitar iOS em CI: rode uma vez em modo interativo para provisionar credenciais." 
            exit 0
          fi

          exit "$exit_code"
