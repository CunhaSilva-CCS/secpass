name: Deploy App EAS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil EAS
        required: true
        default: production
        type: choice
        options:
          - preview
          - production
      platform:
        description: Plataforma de build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

env:
  NODE_VERSION: 20

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN nao configurado nos secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run lint
          npm test -- --runInBand

      - name: Build with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --profile ${{ github.event.inputs.profile }} \
            --platform ${{ github.event.inputs.platform }} \
            --non-interactive
