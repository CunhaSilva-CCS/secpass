name: Deploy Backend Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: >-
          Ambiente de deploy
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: >-
          Tag da imagem (ex: v1.2.0)
        required: true
        type: string

env:
  NODE_VERSION: 20
  SERVICE_NAME: secpass-backend
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate backend
        working-directory: backend
        run: |
          npm ci
          npm run lint --if-present

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION_DOCKER_HOST }} --quiet

      - name: Build and push backend image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION_DOCKER_HOST: ${{ secrets.GCP_REGION_DOCKER_HOST }}
        run: |
          IMAGE_URI=${GCP_REGION_DOCKER_HOST}/${GCP_PROJECT_ID}/secpass/secpass-backend:${{ github.event.inputs.image_tag }}
          docker build -f backend/Dockerfile -t "$IMAGE_URI" backend
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PASSWORD_RESET_URL_BASE: ${{ secrets.PASSWORD_RESET_URL_BASE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_URI" \
            --project "$GCP_PROJECT_ID" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,PORT=8080,CORS_ORIGIN=${CORS_ORIGIN},ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET},REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET},ACCESS_TOKEN_TTL=15m,REFRESH_TOKEN_TTL=7d,RESET_TOKEN_TTL_MINUTES=15,BCRYPT_ROUNDS=12,SMTP_HOST=${SMTP_HOST},SMTP_PORT=${SMTP_PORT},SMTP_SECURE=${SMTP_SECURE},SMTP_USER=${SMTP_USER},SMTP_PASS=${SMTP_PASS},EMAIL_FROM=${EMAIL_FROM},PASSWORD_RESET_URL_BASE=${PASSWORD_RESET_URL_BASE},DATABASE_URL=${DATABASE_URL},AUTH_STORE_TABLE=auth_state,AUTH_STORE_PATH=/tmp/auth-store.json"

      - name: Show service URL
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project "$GCP_PROJECT_ID" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)'
