name: Release Coordenada

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versao da release (ex: v1.2.0)"
        required: true
        type: string
      deploy_app:
        description: "Executar deploy/build do app"
        required: true
        default: true
        type: boolean
      deploy_backend:
        description: "Executar deploy do backend"
        required: true
        default: true
        type: boolean

env:
  NODE_VERSION: 20

jobs:
  release-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Validate app release secrets
        if: github.event.inputs.deploy_app == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN nao configurado para deploy do app."
            exit 1
          fi

      - name: Validate backend release secrets
        if: github.event.inputs.deploy_backend == 'true'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION_DOCKER_HOST: ${{ secrets.GCP_REGION_DOCKER_HOST }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PASSWORD_RESET_URL_BASE: ${{ secrets.PASSWORD_RESET_URL_BASE }}
        run: |
          for required in GCP_SA_KEY GCP_PROJECT_ID GCP_REGION_DOCKER_HOST CORS_ORIGIN ACCESS_TOKEN_SECRET REFRESH_TOKEN_SECRET EMAIL_FROM PASSWORD_RESET_URL_BASE; do
            value=$(eval "echo \${$required}")
            if [ -z "$value" ]; then
              echo "$required nao configurado para deploy do backend."
              exit 1
            fi
          done

  quality-app:
    runs-on: ubuntu-latest
    needs: release-preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

  quality-backend:
    runs-on: ubuntu-latest
    needs: release-preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend package
        id: detect_backend
        run: |
          if [ -f backend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.detect_backend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        if: steps.detect_backend.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

      - name: Run backend lint
        if: steps.detect_backend.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint --if-present

      - name: Run backend tests
        if: steps.detect_backend.outputs.exists == 'true'
        working-directory: backend
        run: npm test --if-present

      - name: Skip backend checks
        if: steps.detect_backend.outputs.exists != 'true'
        run: echo "No backend/package.json found. Backend checks skipped."

  release-summary:
    runs-on: ubuntu-latest
    needs:
      - quality-app
      - quality-backend

    steps:
      - name: Build release summary
        run: |
          echo "Release version: ${{ github.event.inputs.release_version }}"
          echo "Deploy app: ${{ github.event.inputs.deploy_app }}"
          echo "Deploy backend: ${{ github.event.inputs.deploy_backend }}"
          echo "Quality gates passed. Ready for coordinated deployment."

      - name: App deploy
        if: github.event.inputs.deploy_app == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --profile production \
            --platform all \
            --non-interactive

      - name: Authenticate to Google Cloud
        if: github.event.inputs.deploy_backend == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        if: github.event.inputs.deploy_backend == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        if: github.event.inputs.deploy_backend == 'true'
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION_DOCKER_HOST }} --quiet

      - name: Build and push backend image
        if: github.event.inputs.deploy_backend == 'true'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION_DOCKER_HOST: ${{ secrets.GCP_REGION_DOCKER_HOST }}
        run: |
          IMAGE_URI=${GCP_REGION_DOCKER_HOST}/${GCP_PROJECT_ID}/secpass/secpass-backend:${{ github.event.inputs.release_version }}
          docker build -f backend/Dockerfile -t "$IMAGE_URI" backend
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Backend deploy
        if: github.event.inputs.deploy_backend == 'true'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PASSWORD_RESET_URL_BASE: ${{ secrets.PASSWORD_RESET_URL_BASE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          gcloud run deploy secpass-backend \
            --image "$IMAGE_URI" \
            --project "$GCP_PROJECT_ID" \
            --region "us-central1" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,PORT=8080,CORS_ORIGIN=${CORS_ORIGIN},ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET},REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET},ACCESS_TOKEN_TTL=15m,REFRESH_TOKEN_TTL=7d,RESET_TOKEN_TTL_MINUTES=15,BCRYPT_ROUNDS=12,SMTP_HOST=${SMTP_HOST},SMTP_PORT=${SMTP_PORT},SMTP_SECURE=${SMTP_SECURE},SMTP_USER=${SMTP_USER},SMTP_PASS=${SMTP_PASS},EMAIL_FROM=${EMAIL_FROM},PASSWORD_RESET_URL_BASE=${PASSWORD_RESET_URL_BASE},DATABASE_URL=${DATABASE_URL},AUTH_STORE_TABLE=auth_state,AUTH_STORE_PATH=/tmp/auth-store.json"
